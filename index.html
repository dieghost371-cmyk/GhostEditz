<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GHOST-KING • Secure Pairing Terminal</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="grid"></div>
  <main class="panel">
    <div class="avatar">👻</div>
    <h1><span>GHOST</span>-KING</h1>
    <p class="subtitle">SECURE PAIRING TERMINAL</p>

    <div class="tabs">
      <button class="tab active">〉_ CODE</button>
      <button class="tab">▦ QR CODE</button>
    </div>

    <input id="phone" inputmode="numeric" placeholder="9474XXXXXXXX" autocomplete="off">
    <button id="pair" class="primary">GENERATE PAIR CODE →</button>

    <p class="label">YOUR CONNECTION CODE</p>
    <div id="code" class="code">— — — — — — — —</div>

    <div class="status"><span id="dot"></span><span id="status">SERVER ONLINE</span><span>•</span><span>V1.0.0</span></div>
  </main>

  <section class="commands">
    <h2>GHOST-KING API</h2>
    <div id="commandList"></div>
  </section>

  <script src="/app.js"></script>
</body>
</html>
